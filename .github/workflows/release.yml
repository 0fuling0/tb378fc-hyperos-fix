name: 构建并发布模块（Lite）

# 触发方式
#   1) 推一个 v* 的 tag —— 常规路径（例如 git push origin v1.0）
#   2) 手动：Actions 页面 → 本 workflow → Run workflow（tag 留空就用 module.prop 里的 version）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v1.0）。留空则用 module/module.prop 里的 version。'
        required: false
        type: string

# 创建 Release 需要 contents: write。
# 注意：本仓库是 fork，GitHub 文档说派生仓库里「通常无法授予写入权限」。
# 如果 Release 那一步报 403，见 README「自动发布」一节的两条处置。
permissions:
  contents: write

jobs:
  release:
    name: 自检 + 打包 + 发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取 module.prop
        id: mod
        run: |
          set -euo pipefail
          mod_id=$(sed -n 's/^id=//p'      module/module.prop | head -1)
          mod_ver=$(sed -n 's/^version=//p' module/module.prop | head -1)
          [ -n "$mod_id" ]  || { echo "::error::module/module.prop 里读不到 id";      exit 1; }
          [ -n "$mod_ver" ] || { echo "::error::module/module.prop 里读不到 version"; exit 1; }
          echo "id=$mod_id"       >> "$GITHUB_OUTPUT"
          echo "version=$mod_ver" >> "$GITHUB_OUTPUT"
          echo "module.prop → id=$mod_id  version=$mod_ver"

      # 值一律走 env 传入，不在 run: 里直接插 ${{ }} —— 避免 tag 里的特殊字符炸 shell，
      # 也避免 GitHub 把它判成脚本注入。
      - name: 决定本次发布的 tag
        id: rel
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          MOD_VERSION: ${{ steps.mod.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="$INPUT_TAG"
            [ -n "$tag" ] || tag="$MOD_VERSION"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "本次发布 tag：$tag"

      # 防「tag 是 v3.6、包里却是 v3.5」这种版本错位 —— 发出去就不好回收了。
      - name: 校验 tag 与 module.prop 的 version 一致
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
          MOD_VERSION: ${{ steps.mod.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_TAG" != "$MOD_VERSION" ]; then
            echo "::error::tag 是 '$RELEASE_TAG'，但 module/module.prop 里是 '$MOD_VERSION'。先把 module.prop 的 version 改成 '$RELEASE_TAG' 再发 tag，否则 Release 里的包和 tag 对不上。"
            exit 1
          fi
          echo "✓ tag 与 module.prop 一致：$RELEASE_TAG"

      # Lite 分支不需要 Android SDK / NDK —— 模块里没有 App、没有二进制，--pack 就是
      # 自检 + 打包 + 产物校验，几秒出包。四道自检：sh -n、未定义函数、
      # WebUI 渲染与交互、产物校验（行尾 / 残留 / 权限位 / 版本 / payload 完整性）。
      - name: 脚本自检 + 打包 + 产物校验
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh --pack

      - name: 上传 zip（artifact，不进 Release 也能下载）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mod.outputs.id }}-${{ steps.mod.outputs.version }}
          path: out/*.zip
          if-no-files-found: error

      - name: 创建 GitHub Release 并附上 zip
        env:
          # 优先用 RELEASE_TOKEN（PAT）。fork 里的 GITHUB_TOKEN 常常没有写权限，
          # 配了 RELEASE_TOKEN 就稳了；没配就退回 github.token 试试。
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          zipfile=$(ls out/*.zip | head -1)
          echo "准备发布：$RELEASE_TAG ← $zipfile"

          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          KernelSU 模块包（zip 根目录即模块根目录）。

          ## 这个版本做什么
          **只做系统修复，不含任何常驻守护进程，不安装任何 APK，不需要 LSPosed。**

          - **② PowerKeeper**：修补移植包改坏的两处字节码（`void` 方法里 `return` 值、
            静态方法丢了 `static`），恢复 MIUI 省电管理 —— 否则 `com.miui.powerkeeper` 开机即崩。
          - **③ 停 BPF 监视器**：开机后一次性停掉 `hyper_bpfloader` 的监视器（`dynbpfloader`），
            避免它因为 6.10+ 内核的私有 BPF 程序在 6.6.82 上加载不了而判定"系统损坏"、
            写 recovery 引导块并重启进 recovery。
          - **④ 停死电话栈**：本机 `ro.baseband=apq` 无 modem，停掉每秒崩数百次的三个电话包。
          - **⑭ 开发者选项**：补两条最小 SELinux 权限，否则 Enforcing 下打开
            「设置 → 开发者选项」必现闪退。**没有开关，永远生效。**

          ②③④ 全部是"开机后做一次就结束"，⑭ 在 post-fs-data 与开机后各补一次 ——
          **运行期没有任何常驻进程**，不占内存、不耗电、不需要看护。

          ## 安装
          1. 把下面的 zip 丢给 KernelSU 管理器安装（或 `magisk --install-module`）。
          2. 重启。
          3. 装完在 KernelSU 管理器的模块页打开 WebUI，可以逐项开关并看实时状态。

          ## 注意
          - 需要 App 的手写笔功能（唤醒 / 电量胶囊 / 手势桥 / 笔刷触感 / 注视感知等）
            在**同仓库 Full 分支**，本分支不包含。
          - 本模块 id 是 `tb378fc_hyperos_fix_lite`，与 Full 分支的模块 **id 不同、可以共存**，
            但两项会争同一个 PowerKeeper 挂载点，**请只开其中一个**。

          详细说明见仓库 README.md。
          NOTES

          # 幂等：Release 已存在就只补传/覆盖附件，避免重跑时报「already exists」。
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，覆盖附件"
            gh release upload "$RELEASE_TAG" "$zipfile" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$zipfile" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url \
            --template '✓ 已发布：{{.tagName}}  {{.url}}{{"\n"}}'
