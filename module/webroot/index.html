<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>TB378FC HyperOS 修复</title>
<style>
/* ==========================================================================
   设计令牌 —— Material Design 3（M3）
   色板取 M3 蓝（source #415F91）的官方 tonal 映射：亮/暗各一套语义色。
   形状用 M3 Expressive 的更大圆角（文本框 12dp、卡片 16dp、按钮全圆）。
   为什么全部内联：KernelSU 的 WebUI 跑在本地 WebView 里，**没有网络**，
   不能引 CDN，也不能依赖任何外部字体/图标（图标一律内联 SVG path）。
   ========================================================================== */
:root{
  /* ---- 主色 ---- */
  --primary:#415F91;            --on-primary:#FFFFFF;
  --primary-container:#D6E3FF;  --on-primary-container:#001B3E;
  --secondary:#565F71;          --on-secondary:#FFFFFF;
  --secondary-container:#DAE2F9;--on-secondary-container:#131C2B;
  --tertiary:#705575;           --on-tertiary:#FFFFFF;
  --tertiary-container:#FAD8FD; --on-tertiary-container:#28132E;
  --error:#BA1A1A;              --on-error:#FFFFFF;
  --error-container:#FFDAD6;    --on-error-container:#410002;
  /* ---- 表面（M3 有 5 级 surface container，层次靠它们而不是阴影）---- */
  --surface:#F9F9FF;            --on-surface:#191C20;
  --surface-variant:#E0E2EC;    --on-surface-variant:#44474E;
  --s-lowest:#FFFFFF;
  --s-low:#F3F3FA;
  --s-container:#EDEDF4;
  --s-high:#E7E8EE;
  --s-highest:#E2E2E9;
  --outline:#74777F;            --outline-variant:#C4C6D0;
  --inverse-surface:#2E3135;    --inverse-on-surface:#EFF0F7;
  --scrim:rgba(0,0,0,.32);
  /* ---- 高度（M3 elevation 1/2/3）---- */
  --e1:0 1px 2px rgba(0,0,0,.30),0 1px 3px 1px rgba(0,0,0,.15);
  --e2:0 1px 2px rgba(0,0,0,.30),0 2px 6px 2px rgba(0,0,0,.15);
  --e3:0 4px 8px 3px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.30);
  /* ---- 形状 ---- */
  --r-xs:4px; --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:28px; --r-full:999px;
}
html[data-theme="dark"]{
  --primary:#A9C7FF;            --on-primary:#082F5F;
  --primary-container:#284777;  --on-primary-container:#D6E3FF;
  --secondary:#BEC6DC;          --on-secondary:#283141;
  --secondary-container:#3E4759;--on-secondary-container:#DAE2F9;
  --tertiary:#DDBCE0;           --on-tertiary:#3F2844;
  --tertiary-container:#573E5C; --on-tertiary-container:#FAD8FD;
  --error:#FFB4AB;              --on-error:#690005;
  --error-container:#93000A;    --on-error-container:#FFDAD6;
  --surface:#111318;            --on-surface:#E2E2E9;
  --surface-variant:#44474E;    --on-surface-variant:#C4C6D0;
  --s-lowest:#0C0E13;
  --s-low:#191C20;
  --s-container:#1D2024;
  --s-high:#282A2F;
  --s-highest:#33353A;
  --outline:#8E9099;            --outline-variant:#44474E;
  --inverse-surface:#E2E2E9;    --inverse-on-surface:#2E3135;
  --scrim:rgba(0,0,0,.5);
  --e1:0 1px 2px rgba(0,0,0,.55),0 1px 3px 1px rgba(0,0,0,.35);
  --e2:0 1px 2px rgba(0,0,0,.55),0 2px 6px 2px rgba(0,0,0,.35);
  --e3:0 4px 8px 3px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.55);
}

/* ========================================================================== 基础
   M3 排版尺度：title-large 22/28、title-medium 16/24、body-large 16/24、
   body-medium 14/20、body-small 12/16、label-large 14/20、label-medium 12/16 */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface);color:var(--on-surface);
  font:400 14px/20px Roboto,-apple-system,"Noto Sans CJK SC","Source Han Sans SC",
       "PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
  padding-bottom:40px;
  letter-spacing:.1px;
}
.wrap{max-width:840px;margin:0 auto;padding:0 12px}
code{font-family:ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK SC",monospace;font-size:.92em}

/* ========================================================================== M3 Top App Bar
   静息态是 surface 且无阴影；滚动后升到 surfaceContainer（M3 的滚动行为）。 */
.appbar{position:sticky;top:0;z-index:20;background:var(--surface);transition:background .2s}
.appbar.scrolled{background:var(--s-container)}
.appbar .bar{
  max-width:840px;margin:0 auto;padding:8px 6px 8px 12px;
  display:flex;align-items:center;gap:4px;min-height:64px;
}
.appbar .mark{
  width:40px;height:40px;border-radius:var(--r-m);flex:0 0 auto;
  background:var(--primary-container);color:var(--on-primary-container);
  display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:13px;letter-spacing:-.3px;
}
.appbar .t1{font-size:22px;line-height:28px;font-weight:400}
.appbar .t2{font-size:12px;line-height:16px;color:var(--on-surface-variant);margin-top:2px}
.appbar .grow{flex:1;min-width:0;padding-left:6px}
/* M3 icon button：40dp 触达、全圆、状态层靠 ::after */
.iconbtn{
  position:relative;width:40px;height:40px;border:0;border-radius:var(--r-full);
  background:transparent;color:var(--on-surface-variant);cursor:pointer;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.iconbtn::after{
  content:"";position:absolute;inset:0;background:currentColor;opacity:0;
  transition:opacity .12s;
}
.iconbtn:hover::after{opacity:.08}
.iconbtn:active::after{opacity:.12}
.iconbtn svg{width:22px;height:22px;fill:currentColor;position:relative;z-index:1}
.iconbtn:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
/* M3 线性进度条：4dp 轨道 + 全圆指示条 */
#prog{height:4px;background:transparent;overflow:hidden;border-radius:var(--r-full);margin:0 12px}
#prog.on{background:var(--s-highest)}
#prog.on::after{
  content:"";display:block;height:100%;width:35%;background:var(--primary);
  border-radius:var(--r-full);
  animation:slide 1.1s cubic-bezier(.2,0,0,1) infinite;
}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}

/* ========================================================================== M3 Card（filled）
   M3 用 surface container 层级表达层次，阴影很克制 —— 这里只在 hover 时给 e1。 */
.card{
  background:var(--s-low);border-radius:var(--r-l);
  margin-top:12px;overflow:hidden;
}
.card>.head{padding:16px 16px 12px;display:flex;align-items:flex-start;gap:12px}
.card>.head .grow{flex:1;min-width:0}
.card .ctitle{font-size:16px;line-height:24px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .cnote{font-size:12px;line-height:16px;color:var(--on-surface-variant);margin-top:4px}
.card .body{padding:0 0 4px}
.card .foot{padding:8px 16px 16px}

/* ========================================================================== M3 List item
   56dp 最小高度、16dp 水平内边距；分隔线用 outlineVariant。 */
.row{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;min-height:56px;
}
.row+.row{box-shadow:inset 0 1px 0 var(--outline-variant)}
.row.sub{min-height:48px;padding:10px 16px 10px 44px}
.row .lab{flex:1;min-width:0}
.row .pri{font-size:14px;line-height:20px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .sec{font-size:12px;line-height:16px;color:var(--on-surface-variant);margin-top:3px}
.row .ctl{flex:0 0 auto;display:flex;align-items:center;gap:10px}
/* 父项关着 → 整行降不透明度，三级开关也跟着暗下去（并已显示为关，见 itemRow） */
.row.disabled .pri,.row.disabled .sec{opacity:.55}
.row.disabled .sw,.row.disabled .sel{opacity:.55}

/* 功能编号徽章（M3 没有对应件，做成 tonal 小药丸） */
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;padding:0 6px;border-radius:var(--r-full);
  background:var(--primary-container);color:var(--on-primary-container);
  font-size:11px;font-weight:600;line-height:1;flex:0 0 auto;
}

/* ========================================================================== M3 Chip（assist / label）
   32dp 高、8dp 圆角；这里为了信息密度压到 26dp，形状仍是 M3 的。 */
.chip{
  display:inline-flex;align-items:center;gap:4px;
  height:26px;padding:0 10px;border-radius:var(--r-s);
  font-size:11px;font-weight:500;line-height:1;letter-spacing:.2px;
  border:1px solid transparent;white-space:nowrap;
}
.chip.ok  {background:var(--primary-container);  color:var(--on-primary-container)}
.chip.warn{background:var(--tertiary-container); color:var(--on-tertiary-container)}
.chip.err {background:var(--error-container);    color:var(--on-error-container)}
.chip.info{background:var(--secondary-container);color:var(--on-secondary-container)}
.chip.mute{background:transparent;color:var(--on-surface-variant);border-color:var(--outline-variant)}

/* ========================================================================== M3 Switch
   轨道 52×32、全圆；滑块 16dp（关）→ 24dp（开，带对勾）。
   混合态 M3 没有原生件，做成"轨道+短横"，语义仍是"部分开启"。 */
.sw{
  position:relative;width:52px;height:32px;border-radius:var(--r-full);
  background:var(--s-highest);box-shadow:inset 0 0 0 2px var(--outline);
  flex:0 0 auto;cursor:pointer;
  transition:background .2s,box-shadow .2s;
}
.sw .thumb{
  position:absolute;top:8px;left:8px;width:16px;height:16px;border-radius:50%;
  background:var(--outline);z-index:1;
  display:flex;align-items:center;justify-content:center;
  transition:top .2s,left .2s,width .2s,height .2s,background .2s;
}
.sw .thumb svg{width:16px;height:16px;display:block;fill:var(--primary);opacity:0;transition:opacity .15s}
.sw.on{background:var(--primary);box-shadow:none}
.sw.on .thumb{top:4px;left:24px;width:24px;height:24px;background:var(--on-primary)}
.sw.on .thumb svg{opacity:1}
/* 混合：轨道保持中性，滑块里一条短横 */
.sw.ind .thumb::after{content:"";width:10px;height:2px;border-radius:1px;background:var(--on-surface-variant)}
/* 状态层：M3 是"以滑块圆心为中心的 40dp 圆"。滑块圆心：关=16px、开=36px。 */
.sw::after{
  content:"";position:absolute;top:50%;left:16px;width:40px;height:40px;
  border-radius:50%;background:var(--on-surface);transform:translate(-50%,-50%);
  opacity:0;pointer-events:none;z-index:0;
  transition:opacity .12s,left .2s;
}
.sw.on::after{left:36px}
.sw:hover::after{opacity:.08}
.sw:active::after{opacity:.12}
.sw:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.sw.busy{opacity:.55;pointer-events:none}

/* ========================================================================== M3 Text field（outlined，Expressive 12dp 圆角）
   原生 <select> 不能放子元素，箭头只能用 data-URI，因此明暗各写一份。 */
.sel{
  appearance:none;-webkit-appearance:none;
  background:var(--s-lowest);color:var(--on-surface);
  border:1px solid var(--outline);border-radius:var(--r-m);
  padding:9px 34px 9px 12px;font-size:13px;line-height:18px;font-family:inherit;
  min-width:146px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M7 10l5 5 5-5z' fill='%2374777F'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center;background-size:20px 20px;
}
html[data-theme="dark"] .sel{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M7 10l5 5 5-5z' fill='%238E9099'/></svg>");
}
.sel:hover{border-color:var(--on-surface)}
.sel:focus{outline:none;border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.sel:disabled{opacity:.45;cursor:default}

/* ========================================================================== M3 Button
   filled / tonal / outlined / text 四种；40dp 高、20dp 圆角（= 高度一半）。 */
.btn{
  appearance:none;border:0;border-radius:var(--r-full);
  font-family:inherit;font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;
  height:40px;padding:0 24px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  position:relative;overflow:hidden;
  transition:box-shadow .15s,background .15s;
}
.btn::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .12s}
.btn:hover::after{opacity:.08}
.btn:active::after{opacity:.12}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.filled:hover{box-shadow:var(--e1)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.outlined{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1px var(--outline)}
.btn.text{background:transparent;color:var(--primary);padding:0 12px}
.btn:disabled{background:var(--on-surface);color:var(--surface);opacity:.12;cursor:default;box-shadow:none}
.btn:disabled::after{opacity:0}
.btn:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ========================================================================== M3 提示块
   M3 没有 Alert，用 tonal container 表达语义（info=primary、warn=tertiary、err=error）。 */
.alert{
  display:flex;gap:10px;align-items:flex-start;
  border-radius:var(--r-m);padding:12px 14px;font-size:12px;line-height:16px;
  margin:10px 16px 0;
}
.alert.warn{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.alert.err {background:var(--error-container);   color:var(--on-error-container)}
.alert.info{background:var(--primary-container); color:var(--on-primary-container)}
.alert b{font-weight:600}
.alert code{background:rgba(0,0,0,.06);border-radius:4px;padding:0 3px}

/* ========================================================================== 分组小标题（M3 title-small） */
.sechead{
  display:flex;align-items:center;gap:8px;
  padding:16px 16px 8px;font-size:14px;line-height:20px;font-weight:500;
  color:var(--on-surface-variant);
}
.sechead::after{content:"";flex:1;height:1px;background:var(--outline-variant)}

/* ========================================================================== 日志（M3 surfaceContainerHighest 上的等宽块） */
#log{
  white-space:pre-wrap;word-break:break-all;
  font:12px/16px ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK SC",monospace;
  color:var(--on-surface-variant);
  background:var(--s-highest);border-radius:var(--r-m);
  max-height:190px;overflow:auto;margin:0 16px 16px;padding:12px;
}
#log .bad{color:var(--error)}
#log .good{color:var(--primary)}

/* ========================================================================== M3 Snackbar
   inverseSurface 底 + inverseOnSurface 字，4dp 圆角，elevation 3。 */
.snack{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(200%);
  background:var(--inverse-surface);color:var(--inverse-on-surface);
  font-size:14px;line-height:20px;
  padding:14px 16px;border-radius:var(--r-xs);box-shadow:var(--e3);
  max-width:88vw;z-index:60;transition:transform .25s cubic-bezier(.2,0,0,1);
  display:flex;align-items:center;gap:10px;
}
.snack.show{transform:translateX(-50%) translateY(0)}
.snack .dot{width:8px;height:8px;border-radius:50%;background:var(--inverse-primary,#A9C7FF);flex:0 0 auto}
.snack.bad .dot{background:var(--error)}

.foot-note{color:var(--on-surface-variant);font-size:12px;line-height:16px;padding:16px 4px 0;text-align:center}
</style>
</head>
<body>

<header class="appbar" id="appbar">
  <div class="bar">
    <div class="mark">TB</div>
    <div class="grow">
      <div class="t1">TB378FC HyperOS 修复</div>
      <div class="t2" id="sub">正在读取配置…</div>
    </div>
    <button class="iconbtn" id="btnReload" title="重新读取配置" aria-label="重新读取配置">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
    <button class="iconbtn" id="btnTheme" title="切换明暗主题" aria-label="切换明暗主题">
      <svg id="icoTheme" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-5.4-5.4c0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z"/></svg>
    </button>
  </div>
  <div id="prog"></div>
</header>

<main class="wrap" id="app"></main>
<div class="foot-note">改动写入模块 <code>config</code>，守护约 20 秒后重启生效</div>

<div class="snack" id="snack"><span class="dot"></span><span id="snackTxt"></span></div>

<script>
/* ==========================================================================
   KernelSU WebUI 桥
   ========================================================================== */
const M = "/data/adb/modules/tb378fc_hyperos_fix";

const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined && txt !== null) n.textContent = txt;
  return n;
};

let CFG = {};        // --json 的结果
let APPST = {installed: 0, needed: 0};
let LOGLINES = [];   // 本页面的操作日志（重绘时按这个数组重放，不用 innerHTML）
let busy = false;

function log(msg, kind) {
  const d = new Date();
  const p2 = n => String(n).padStart(2, "0");
  const item = {
    msg: msg, kind: kind || "",
    t: p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds())
  };
  LOGLINES.push(item);
  if (LOGLINES.length > 300) LOGLINES.shift();
  const box = $("#log");
  if (!box) return;
  box.appendChild(logLine(item));
  box.scrollTop = box.scrollHeight;
}

function logLine(item) {
  const line = el("div", item.kind === "bad" ? "bad" : (item.kind === "good" ? "good" : ""));
  line.textContent = item.t + "  " + item.msg;
  return line;
}

function setBusy(on) {
  const v = !!on;
  const changed = (v !== busy);
  busy = v;
  $("#prog").classList.toggle("on", busy);
  /* 忙碌时要让所有控件变成不可点（.busy），结束后要恢复 —— 靠重绘来同步，
     否则开关会一直停在灰掉的状态上。render() 本身不会再调 setBusy，不会递归。 */
  if (changed && $("#app")) render();
}

let snackTimer = null;
function snack(msg, bad) {
  $("#snackTxt").textContent = msg;
  $("#snack").classList.toggle("bad", !!bad);
  $("#snack").classList.add("show");
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => $("#snack").classList.remove("show"), 3200);
}

function q(v) { return "'" + String(v).replace(/'/g, "'\\''") + "'"; }

async function run(cmd) {
  try {
    if (!window.ksu || !ksu.exec) throw new Error("KernelSU WebUI API 不可用（请用 KernelSU 管理器打开本页）");
    const r = await ksu.exec(cmd);
    const out = (typeof r === "string") ? r : ((r && (r.stdout || r.result)) || "");
    const err = (r && r.stderr) || "";
    if (err) log("stderr: " + err, "bad");
    return {out: out || "", err: err || ""};
  } catch (e) {
    log("执行失败: " + e.message, "bad");
    return {out: "", err: String(e)};
  }
}

/* ==========================================================================
   功能模型：分类 → 功能项
   on/off = 该键"开/关"时写进 config 的值（手势映射是键码，不是 1/0）
   app    = 需要那个 APK（dev.tb378fc.fix）
   lsp    = 还额外需要 LSPosed 钩子
   fixed  = 没有开关（崩溃修复），只在界面上说明
   ========================================================================== */
const CATS = [
  {
    id: "sys", name: "系统修复",
    note: "移植包自身的问题，只靠模块（root + 内核/属性/包管理）就能修，不需要 App",
    items: [
      {k:"FIX_POWERKEEPER", on:"1", off:"0", n:"②", t:"PowerKeeper 修复",
       d:"修补移植包改坏的两处字节码，恢复 MIUI 省电管理"},
      {k:"FIX_BPFMON", on:"1", off:"0", n:"③", t:"停 BPF 监视器",
       d:"避免 hyper_bpfloader 判定「系统损坏」去写 recovery 引导块"},
      {k:"FIX_TELEPHONY", on:"1", off:"0", n:"④", t:"停死电话栈",
       d:"本机无 modem，停掉每秒崩数百次的三件套"},
      {n:"⑭", t:"开发者选项（SELinux）", fixed:true,

/* ==========================================================================
   取值辅助
   ========================================================================== */
const isOn = v => v === 1 || v === "1" || v === true;
const cfgOf = k => CFG[k];

function mapOf(key) {
  const o = {};
  String(CFG[key] || "").split(",").forEach(kv => {
    const p = kv.split(":");
    if (p.length === 2 && p[0].trim() !== "") o[p[0].trim()] = p[1].trim();
  });
  return o;
}
function anyAppOn() {
  for (const c of CATS) for (const it of c.items) {
    if (it.k && it.app && isOn(CFG[it.k])) return true;
  }
  return false;
}
/* 分类总开关的状态：on / off / ind（混合） */
function catState(cat) {
  const keys = cat.items.filter(i => i.k);
  let on = 0;
  for (const it of keys) if (isOn(CFG[it.k])) on++;
  if (on === 0) return "off";
  if (on === keys.length) return "on";
  return "ind";
}

/* ==========================================================================
   写入配置
   pairs: [[key, value], ...] —— 一次写完再统一重启守护（见 service.sh --set）
   ========================================================================== */
async function writePairs(pairs, note) {
  if (!pairs.length) return;
  setBusy(true);
  pairs.forEach(([k, v]) => { CFG[k] = String(v); });
  render();                                   // 先本地乐观更新，界面立刻响应
  log("保存 " + pairs.map(p => p[0] + "=" + p[1]).join(" ") + (note ? "（" + note + "）" : "") + " …");
  const args = pairs.map(p => p[0] + " " + q(p[1])).join(" ");
  const r = await run("sh " + M + "/service.sh --set " + args);
  if (/^ok\b/.test(r.out.trim())) {
    log("已保存（守护 ~20 秒后重启生效）", "good");
    snack("已保存，约 20 秒后生效");
  } else {
    log("保存返回: " + (r.out || r.err), "bad");
    snack("保存失败：" + (r.out || r.err || "无输出"), true);
  }
  /* 分组"需要 App"的项变了 → 立刻对齐 APK（该装就装、该卸就卸） */
  if (pairs.some(p => p[0] === "AON" || p[0] === "PEN_WAKE" || p[0] === "CAPSULE" ||
                      p[0] === "BRUSH" || p[0] === "PEN_REST" ||
                      p[0] === "SETTINGS_SYNC" || p[0] === "SCREEN_CMD")) {
    await syncApk(true);
  }
  setBusy(false);
}

async function syncApk(silent) {
  if (!silent) setBusy(true);
  const before = APPST.installed;
  const r = await run("sh " + M + "/service.sh --apksync");
  const m = /installed=([01])/.exec(r.out || "");
  APPST.installed = m ? Number(m[1]) : APPST.installed;
  APPST.needed = anyAppOn() ? 1 : 0;
  if (!silent) {
    log("APK 对齐完成：installed=" + APPST.installed, "good");
    snack(APPST.installed ? "APK 已安装" : "APK 未安装（当前没有功能需要它）");
  } else if (before !== APPST.installed) {
    log("APK 状态变化：" + (APPST.installed ? "已自动安装" : "已自动卸载"), "good");
    snack(APPST.installed ? "已自动安装 APK" : "已自动卸载 APK");
  }
  render();
  if (!silent) setBusy(false);
}

/* ==========================================================================
   渲染
   ========================================================================== */
/* M3 Switch：state = on / off / ind。ind（混合）用滑块里的短横表示。 */
function switchNode(state, onClick) {
  const s = el("div", "sw" + (state === "on" ? " on" : (state === "ind" ? " ind" : "")));
  const th = el("span", "thumb");
  /* 对勾图标用 innerHTML 塞进去：SVG 得用 createElementNS 才认命名空间，
     而那个 API 在测试的 DOM 桩里没有；innerHTML 在真浏览器里解析 SVG 一样正确。
     内容是自己写死的常量，没有注入面。 */
  th.innerHTML = "<svg viewBox='0 0 24 24'><path d='M9.55 17.6 4 12.05l1.4-1.4 4.15 4.15 9.05-9.05 1.4 1.4z'/></svg>";
  s.appendChild(th);
  if (busy) s.classList.add("busy");
  s.onclick = onClick;
  return s;
}

function selectNode(options, cur, onChange, disabled) {
  const sel = el("select", "sel");
  let hit = false;
  options.forEach(o => {
    const op = el("option", "", o.t);
    op.value = String(o.v);
    if (String(o.v) === String(cur)) { op.selected = true; hit = true; }
    sel.appendChild(op);
  });
  /* 当前值不在候选里（有人手改过 config）时补一条，别让界面显示成第一个选项 —— 那会撒谎 */
  if (!hit && cur !== undefined && cur !== null && cur !== "") {
    const op = el("option", "", String(cur) + "（当前值）");
    op.value = String(cur);
    op.selected = true;
    sel.insertBefore(op, sel.firstChild);
  }
  sel.disabled = !!disabled;
  sel.onchange = () => onChange(sel.value);
  return sel;
}

function waveOptions() {
  return WAVES.map(w => ({v: w, t: WNAME[w] || String(w)}));
}

function itemRow(it, parentOn) {
  const row = el("div", "row");
  const lab = el("div", "lab");
  const pri = el("div", "pri");
  if (it.n) pri.appendChild(el("span", "badge", it.n));
  pri.appendChild(el("span", "", it.t));
  if (it.app) pri.appendChild(el("span", "chip " + (it.lsp ? "warn" : "info"),
      it.lsp ? "需要 App + LSPosed" : "需要 App"));
  if (it.fixed) pri.appendChild(el("span", "chip mute", "始终启用"));
  lab.appendChild(pri);
  if (it.d) lab.appendChild(el("div", "sec", it.d));
  row.appendChild(lab);

  const ctl = el("div", "ctl");
  if (it.fixed) {
    ctl.appendChild(el("span", "chip ok", "✓"));
  } else {
    const on = isOn(cfgOf(it.k));
    ctl.appendChild(switchNode(on ? "on" : "off", () => {
      const next = on ? it.off : it.on;
      writePairs([[it.k, next]]);
    }));
  }
  row.appendChild(ctl);

  const frag = document.createDocumentFragment();
  frag.appendChild(row);

  /* ⑤ / ⑬ 的子开关（三级）：
     显示状态跟随父项 —— 父项关着就显示为关（并置灰），父项一开回来就恢复原来的值。
     为什么不跟着改 config：这些子项只在父项开着时才有意义，替用户改写会丢掉他的设置；
     界面显示为关 + 点它提示"请先打开上一级开关"，语义已经足够清楚。 */
  if (it.subs) {
    it.subs.forEach(sb => {
      const sr = el("div", "row sub" + (parentOn ? "" : " disabled"));
      const sl = el("div", "lab");
      const sp = el("div", "pri");
      sp.appendChild(el("span", "", sb.t));
      sl.appendChild(sp);
      sl.appendChild(el("div", "sec", sb.d));
      sr.appendChild(sl);
      const sc = el("div", "ctl");
      const son = isOn(cfgOf(sb.k));
      sc.appendChild(switchNode(parentOn && son ? "on" : "off", () => {
        if (!parentOn) { snack("请先打开上一级开关"); return; }
        writePairs([[sb.k, son ? sb.off : sb.on]]);
      }));
      sr.appendChild(sc);
      frag.appendChild(sr);
    });
  }

  /* ⑥ 的手势映射：开关（= 是否 -1）+ 目标键码选择
     开关与下拉必须一致 —— 原来开关只看"值是不是 -1"，⑥ 关掉后下拉显示「关闭」
     而开关还是亮的，自相矛盾。现在两者都乘上 parentOn。 */
  if (it.gestures) {
    GESTURES.forEach(g => {
      const cur = Number(cfgOf(g.k));
      const enabled = cur !== -1 && !isNaN(cur);
      const shown = parentOn && enabled;
      const sr = el("div", "row sub" + (parentOn ? "" : " disabled"));
      const sl = el("div", "lab");
      const sp = el("div", "pri");
      sp.appendChild(el("span", "", g.n));
      sl.appendChild(sp);
      sl.appendChild(el("div", "sec", g.d));
      sr.appendChild(sl);

      const sc = el("div", "ctl");
      sc.appendChild(selectNode(g.opts, shown ? cur : -1, v => {
        if (!parentOn) { snack("请先打开上一级开关"); return; }
        writePairs([[g.k, v]]);
      }, !parentOn || !enabled));
      sc.appendChild(switchNode(shown ? "on" : "off", () => {
        if (!parentOn) { snack("请先打开上一级开关"); return; }
        writePairs([[g.k, enabled ? -1 : g.def]]);
      }));
      sr.appendChild(sc);
      frag.appendChild(sr);
    });
    const tip = el("div", "row sub");
    tip.appendChild(el("div", "lab", ""));
    tip.firstChild.appendChild(el("div", "sec",
      "键码：194 快捷环 · 195 双击 · 196/197 上下滑 · 92 截图键 · 93 速记键 · -1 关闭。" +
      "改完重启模块生效。笔端触控膜功能位只能由 App 经 BLE 写入 —— 首次使用请先开一次上面那组的任一项。"));
    frag.appendChild(tip);
  }

  /* ⑦ 的波形选择 */
  if (it.waves) {
    const bmap = mapOf("BRUSH_MAP");
    WAVE_ROWS.forEach(w => {
      const sr = el("div", "row sub" + (parentOn ? "" : " disabled"));
      const sl = el("div", "lab");
      sl.appendChild(el("div", "pri", w.lab));
      sr.appendChild(sl);
      const sc = el("div", "ctl");
      const cur = w.brush
        ? (bmap[w.brush] !== undefined ? bmap[w.brush] : 36)
        : (cfgOf(w.key) !== undefined ? cfgOf(w.key) : w.def);
      sc.appendChild(selectNode(waveOptions(), cur, v => {
        if (!parentOn) { snack("请先打开上一级开关"); return; }
        if (w.brush) {
          const m = mapOf("BRUSH_MAP");
          m[w.brush] = String(v);
          const order = ["1","2","3","4","10"].filter(x => m[x] !== undefined);
          writePairs([["BRUSH_MAP", order.map(x => x + ":" + m[x]).join(",")]]);
        } else {
          writePairs([[w.key, v]]);
        }
      }, !parentOn));
      sr.appendChild(sc);
      frag.appendChild(sr);
    });
    const tip = el("div", "row sub");
    const tl = el("div", "lab");
    tl.appendChild(el("div", "sec",
      "波形：0 关 · 32 圆珠笔 · 33 铅笔 · 34 马克笔 · 35 橡皮 · 36 联想笔刷 · " +
      "37-41 无音效版 · 42 边缘警告 · 1/3/6/7 系统提示音"));
    tip.appendChild(tl);
    frag.appendChild(tip);
  }

  return frag;
}

function categoryCard(cat) {
  const card = el("section", "card cat");
  const head = el("div", "head");
  const grow = el("div", "grow");
  const title = el("div", "ctitle");
  title.appendChild(el("span", "", cat.name));
  const st = catState(cat);
  title.appendChild(el("span", "chip " + (st === "on" ? "ok" : (st === "off" ? "mute" : "warn")),
      st === "on" ? "全部开启" : (st === "off" ? "全部关闭" : "部分开启")));
  grow.appendChild(title);
  grow.appendChild(el("div", "cnote", cat.note));
  head.appendChild(grow);
  head.appendChild(switchNode(st, () => {
    const members = cat.items.filter(i => i.k);
    const target = (st === "on") ? "off" : "on";        // 混合状态点一下 = 全部打开
    writePairs(members.map(i => [i.k, target === "on" ? i.on : i.off]),
               cat.name + " 总开关 → " + (target === "on" ? "全开" : "全关"));
  }));
  card.appendChild(head);

  const body = el("div", "body");
  cat.items.forEach(it => body.appendChild(itemRow(it, !it.k || isOn(cfgOf(it.k)))));
  card.appendChild(body);
  return card;
}

  grow.appendChild(el("div", "cnote",
    "dev.tb378fc.fix —— 它同时是 LSPosed 钩子。默认不安装；" +
    "只有「需要 App」的功能被打开时才会自动装上，全部关闭后会自动卸载。"));
  head.appendChild(grow);
  card.appendChild(head);

  const body = el("div", "body");
  const btnrow = el("div", "btnrow");
  btnrow.style.padding = "4px 16px 12px";

  b1.onclick = () => syncApk(false);
  const b2 = el("button", "btn outlined", "重新读取配置");

  body.appendChild(note);

  card.appendChild(body);
  return card;
}

  body.appendChild(el("div", "", "要恢复就把模块目录下对应的 disable-* 文件删掉。"));

function logCard() {

function render() {
  const app = $("#app");
  app.textContent = "";

  const mk = markersAlert();
  if (mk) app.appendChild(mk);
  app.appendChild(appCard());
  CATS.forEach(c => app.appendChild(categoryCard(c)));
  app.appendChild(logCard());

  const nOn = CATS.reduce((a, c) => a + c.items.filter(i => i.k && isOn(cfgOf(i.k))).length, 0);
  const nAll = CATS.reduce((a, c) => a + c.items.filter(i => i.k).length, 0);
  $("#sub").textContent = "已开启 " + nOn + " / " + nAll + " 项 · APK " +
    (APPST.installed ? "已安装" : "未安装");
}

/* ==========================================================================
   加载
   ========================================================================== */
async function load() {
  setBusy(true);
  const r = await run("sh " + M + "/service.sh --json");
  let ok = false;
  try {
    const txt = (r.out || "").trim().split("\n").pop();
    CFG = JSON.parse(txt);
    ok = true;
  } catch (e) {
    log("配置解析失败: " + e.message, "bad");
    log("原始输出: " + (r.out || r.err), "bad");
  }
  const a = await run("sh " + M + "/service.sh --appstat");
  const mi = /installed=([01])/.exec(a.out || "");
  if (mi) APPST.installed = Number(mi[1]);
  APPST.needed = anyAppOn() ? 1 : 0;

  render();
  setBusy(false);
  if (ok) log("已读取配置（" + Object.keys(CFG).length + " 个键）", "good");
}

   主题
   ========================================================================== */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $("#icoTheme").innerHTML = (t === "dark")
    ? "<path d='M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5l2 3h-4l2-3zm0 20l-2-3h4l2 3zM2 12l3-2v4l-3-2zm20 0l-3 2v-4l3 2zM4.9 4.9l3.5 1.4-2.1 2.1L4.9 4.9zm14.2 14.2l-1.4-3.5 2.1-2.1 1.4 3.5-2.1 2.1zM19.1 4.9l-1.4 3.5-2.1-2.1 3.5-1.4zM4.9 19.1l1.4-3.5 2.1 2.1-3.5 1.4z'/>"
    : "<path d='M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-5.4-5.4c0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z'/>";
}
(function initTheme() {
  let t = null;
  try { t = localStorage.getItem("tb378fc.theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") {
    t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  applyTheme(t);
})();
$("#btnTheme").onclick = () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  applyTheme(t);
  try { localStorage.setItem("tb378fc.theme", t); } catch (e) {}
};
$("#btnReload").onclick = () => load();

/* M3 Top App Bar 的滚动行为：滚下去之后底色升到 surfaceContainer。
   （window.addEventListener 在测试的 DOM 桩里是空实现，所以这里不必特判。） */
(function initScrollBar() {
  const bar = $("#appbar");
  if (!bar || !window.addEventListener) return;
  const onScroll = () => bar.classList.toggle("scrolled", (window.scrollY || 0) > 4);
  window.addEventListener("scroll", onScroll, {passive: true});
  onScroll();
})();

load();
</script>
