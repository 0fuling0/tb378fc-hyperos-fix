<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TB378FC HyperOS 修复 Lite</title>
<style>
:root{
  --bg:#f6f6f4; --card:#ffffff; --line:rgba(0,0,0,.10); --line2:rgba(0,0,0,.18);
  --fg:#1c1c1a; --fg2:#5f5e5a; --fg3:#8a8880;
  --ok:#0f6e56; --okbg:#e1f5ee;
  --bad:#a32d2d; --badbg:#fcebeb;
  --warn:#854f0b; --warnbg:#faeeda;
  --accent:#185fa5;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1b1b19; --card:#242422; --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.22);
    --fg:#f0efe9; --fg2:#b4b2a9; --fg3:#888780;
    --ok:#9fe1cb; --okbg:#085041;
    --bad:#f7c1c1; --badbg:#501313;
    --warn:#fac775; --warnbg:#412402;
    --accent:#85b7eb;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:16px 14px 28px;background:var(--bg);color:var(--fg);
  font:400 14px/1.6 -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
h1{margin:0;font-size:17px;font-weight:500}
.sub{margin:4px 0 14px;font-size:12px;color:var(--fg2)}
.row{display:flex;align-items:center;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.head{display:flex;align-items:flex-start;gap:10px}
.num{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:var(--bg);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:500;color:var(--fg2)}
.title{flex:1 1 auto;min-width:0}
.title .n{font-size:15px;font-weight:500;display:block}
.title .d{font-size:12px;color:var(--fg2);margin-top:2px}
.desc{margin:10px 0 0;font-size:12.5px;color:var(--fg2)}
.st{margin-top:10px;display:inline-flex;align-items:center;gap:6px;
  font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid transparent}
.st.ok{color:var(--ok);background:var(--okbg)}
.st.bad{color:var(--bad);background:var(--badbg)}
.st.mid{color:var(--warn);background:var(--warnbg)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.sw{flex:0 0 auto;width:48px;height:28px;border-radius:999px;border:1px solid var(--line2);
  background:var(--bg);position:relative;cursor:pointer;transition:background .15s,border-color .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
  background:var(--card);border:1px solid var(--line2);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--okbg);border-color:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--ok);border-color:var(--ok)}
.sw[disabled]{opacity:.45;cursor:default}
.fixed{font-size:12px;color:var(--ok);background:var(--okbg);padding:3px 9px;border-radius:999px;flex:0 0 auto}
.btn{border:1px solid var(--line2);background:var(--bg);color:var(--fg);border-radius:9px;
  padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.primary{color:var(--accent);border-color:var(--accent)}
.note{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;
  font-size:12.5px;color:var(--fg2);margin-bottom:10px}
.note b{color:var(--fg);font-weight:500}
.bar{display:flex;gap:8px;align-items:center;margin:14px 0 10px;flex-wrap:wrap}
.mono{font-family:var(--mono);font-size:11.5px;word-break:break-all}
.log{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  max-height:230px;overflow:auto;font-family:var(--mono);font-size:11.5px;color:var(--fg2);
  white-space:pre-wrap;word-break:break-all}
.log .ok{color:var(--ok)} .log .bad{color:var(--bad)} .log .warn{color:var(--warn)}
.mark{font-size:12px;color:var(--fg2);margin-bottom:10px}
.foot{margin-top:14px;font-size:11.5px;color:var(--fg3);text-align:center}
</style>
</head>
<body>

<h1>TB378FC HyperOS 修复 <span style="color:var(--fg2)">Lite</span></h1>
<div class="sub" id="ver">正在读取状态…</div>

<div class="note">
  <b>这一版只做系统修复，没有任何常驻进程。</b>三个开关都在开机后执行一次就结束 ——
  所以改完开关需要<b>重启设备</b>才生效（不是重启模块）。
  需要 App 的手写笔功能见同仓库 Full 分支。
</div>

<div id="items"></div>

<div id="s14"></div>

<div class="bar">
  <button class="btn primary" id="refresh">刷新状态</button>
  <button class="btn" id="status">查看文本状态</button>
  <span class="mono" id="busy" style="color:var(--fg3)"></span>
</div>

<div class="mark" id="markers"></div>
<div class="log" id="log">就绪。</div>
<div class="foot">Lite 版：只做系统修复 · 无守护进程 · 不安装 APK</div>

<script>
"use strict";
const M = "/data/adb/modules/tb378fc_hyperos_fix_lite";
const $ = s => document.querySelector(s);

let CFG = {};
let busy = false;
const LOG = [];

function logLine(msg, kind) {
  const d = new Date();
  const p2 = n => String(n).padStart(2, "0");
  const ts = p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());
  LOG.push({ ts: ts, msg: String(msg), kind: kind || "" });
  if (LOG.length > 300) LOG.shift();
  paintLog();
}
function paintLog() {
  const box = $("#log");
  box.textContent = "";
  for (const l of LOG) {
    const s = document.createElement("span");
    s.className = l.kind;
    s.textContent = l.ts + "  " + l.msg + "\n";
    box.appendChild(s);
  }
  box.scrollTop = box.scrollHeight;
}

const q = v => "'" + String(v).replace(/'/g, "'\\''") + "'";

async function run(cmd) {
  if (!window.ksu || !ksu.exec) throw new Error("KernelSU WebUI API 不可用（请用 KernelSU 管理器打开本页）");
  const r = await ksu.exec(cmd);
  const out = (typeof r === "string") ? r : ((r && (r.stdout || r.result)) || "");
  const err = (r && r.stderr) || "";
  if (err) logLine("stderr: " + err, "warn");
  return { out: out || "", err: err || "" };
}

async function readCfg() {
  const r = await run("sh " + q(M + "/service.sh") + " --json");
  const m = /\{[\s\S]*\}/.exec(r.out || "");
  if (!m) throw new Error("读不到状态（--json 没有输出）");
  return JSON.parse(m[0]);
}

/* ==========================================================================
   功能模型：Lite 只有四项
   ========================================================================== */
const ITEMS = [
  {
    num: "②", key: "FIX_POWERKEEPER", title: "PowerKeeper 补丁",
    desc: "把修好的 PowerKeeper.apk 用 bind mount 盖到 /system_ext/app/PowerKeeper（挂父目录，" +
          "顺带盖掉 ROM 预编译的 oat/），修补移植者改坏的两处字节码（void 方法里 return 了值、" +
          "静态方法丢了 static）。不做的话 com.miui.powerkeeper 每次开机 VerifyError 崩溃。" +
          "注意：挂载要等 boot_completed 之后才对 App 进程可见，所以开机早期它仍会崩几次，随后自动恢复。",
    st: s => s.POWERKEEPER_SEEN === 1
      ? { k: "ok",  t: "PowerKeeper 已在跑且读到了补丁版" }
      : (s.POWERKEEPER_MOUNTED === 1
          ? { k: "mid", t: "已挂载，但进程还没读到（开机早期，稍后会自愈）" }
          : (s.POWERKEEPER_PAYLOAD === 1
              ? { k: "mid", t: "未挂载 —— 重启后生效" }
              : { k: "bad", t: "payload 缺失，无法修补" }))
  },
  {
    num: "③", key: "FIX_BPFMON", title: "停 BPF 监视器",
    desc: "hyper_bpfloader 的监视器会检查 MIUI 私有 BPF 程序是否已 pin；那套 .o 引用 6.10+ 内核符号、" +
          "而本机内核是 6.6.82，89 个程序一个都加载不了 → 它判定「系统损坏」，写 recovery 引导块并 " +
          "reboot,recovery（实测：不开容器时忍着，一旦用 DroidSpaces 容器就触发）。" +
          "该服务是 init 里的 disabled 服务、只由开机触发器拉起一次，所以停一次即永久生效。",
    st: s => {
      if (s.BPFMON_RUNNING === 1) return { k: "bad", t: "BPF 监视器仍在运行" };
      if (s.BPFMON_SVC === "stopped") return { k: "ok", t: "BPF 监视器已停（init.svc.dynbpfloader=stopped）" };
      return { k: "mid", t: "BPF 监视器状态未知（init.svc.dynbpfloader=" + (s.BPFMON_SVC || "空") + "）" };
    }
  },
  {
    num: "④", key: "FIX_TELEPHONY", title: "停死电话栈",
    desc: "本机 ro.baseband=apq，纯应用处理器、没有集成 modem，框架没有 FEATURE_TELEPHONY；" +
          "移植包却搬来了声明成 persistent 的小米/QTI 电话栈 → getSystemService 返回 null → " +
          "NullPointerException 每秒崩几百次，白烧 zygote / system_server。" +
          "停用状态写在 packages.xml 里，跨重启保持。",
    st: s => s.TELEPHONY_DONE === 1
      ? { k: "ok",  t: "电话栈已处理" + (s.TELEPHONY_STATE ? "：" + s.TELEPHONY_STATE : "") }
      : { k: "bad", t: "电话栈仍有未停用的包：" + (s.TELEPHONY_STATE || "?") }
  }
];

function el(tag, cls, txt) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined && txt !== null) n.textContent = txt;
  return n;
}

function statusPill(st) {
  const cls = st.k === "ok" ? "ok" : (st.k === "bad" ? "bad" : "mid");
  const p = el("span", "st " + cls);
  p.appendChild(el("span", "dot"));
  p.appendChild(el("span", null, st.t));
  return p;
}

function buildItem(it) {
  const card = el("div", "card");
  const head = el("div", "head");

  head.appendChild(el("div", "num", it.num));

  const t = el("div", "title");
  t.appendChild(el("span", "n", it.title));
  const d = el("div", "d");
  // 这里写「修复已启用」而不是「开」：开关说的是"要不要做这项修复"，
  // 不是"被修的那个东西现在是什么状态"。③ 尤其容易被读反 ——
  // 「停 BPF 监视器 开」会被看成「监视器开着」，其实正好相反。
  d.textContent = (CFG[it.key] === 1 ? "修复已启用" : "修复已关闭");
  t.appendChild(d);
  head.appendChild(t);

  const sw = el("button", "sw");
  sw.type = "button";
  sw.setAttribute("role", "switch");
  sw.setAttribute("aria-checked", CFG[it.key] === 1 ? "true" : "false");
  sw.setAttribute("aria-label", it.title);
  sw.addEventListener("click", () => toggle(it, sw));
  head.appendChild(sw);

  card.appendChild(head);
  card.appendChild(el("div", "desc", it.desc));

  const st = it.st(CFG);
  d.textContent = (CFG[it.key] === 1 ? "修复已启用" : "修复已关闭") + " · " + st.t;
  card.appendChild(statusPill(st));
  return card;
}

function buildFixed() {
  const card = el("div", "card");
  const head = el("div", "head");
  head.appendChild(el("div", "num", "⑭"));
  const t = el("div", "title");
  t.appendChild(el("span", "n", "开发者选项 sepolicy"));
  t.appendChild(el("div", "d", "崩溃修复 · 没有开关 · 永远生效"));
  head.appendChild(t);
  head.appendChild(el("span", "fixed", "常开"));
  card.appendChild(head);
  card.appendChild(el("div", "desc",
    "移植包的策略没给 system_app 授权写 logpersistd_logging_prop，于是「设置 → 开发者选项」在 " +
    "Enforcing 下必现闪退（setenforce 0 就正常）：Settings 在 onResume 里写 logd.logpersistd，" +
    "被拒后 native_set 抛 RuntimeException 且没接住。这里只补两条最小权限，不放开别的任何东西。"));
  const bar = el("div", "bar");
  const b = el("button", "btn", "重新应用（免重启）");
  b.addEventListener("click", async () => {
    if (busy) return;
    setBusy(true, "正在重新应用 sepolicy…");
    try {
      await run("sh " + q(M + "/service.sh") + " --sepolicy");
      logLine("已重新应用 sepolicy", "ok");
    } catch (e) {
      logLine("失败: " + e.message, "bad");
    } finally {
      setBusy(false);
    }
  });
  bar.appendChild(b);
  card.appendChild(bar);
  return card;
}

function setBusy(v, txt) {
  busy = v;
  $("#busy").textContent = txt || "";
  for (const b of document.querySelectorAll("button")) b.disabled = v;
}

async function toggle(it, sw) {
  if (busy) return;
  const next = CFG[it.key] === 1 ? 0 : 1;
  setBusy(true, "正在写入 " + it.key + "…");
  try {
    const r = await run("sh " + q(M + "/service.sh") + " --set " + it.key + " " + next);
    if (r.err) throw new Error(r.err);
    CFG[it.key] = next;
    sw.setAttribute("aria-checked", next === 1 ? "true" : "false");
    logLine(it.key + " → " + next + "（重启设备后生效）", "ok");
    render();
  } catch (e) {
    logLine("写入失败: " + e.message, "bad");
  } finally {
    setBusy(false);
  }
}

function render() {
  const box = $("#items");
  box.textContent = "";
  for (const it of ITEMS) box.appendChild(buildItem(it));

  const box14 = $("#s14");
  box14.textContent = "";
  box14.appendChild(buildFixed());

  const mk = (CFG.MARKERS || "").trim();
  $("#markers").textContent = mk ? ("存在的标记文件：" + mk + "（优先级高于开关）") : "没有 disable-* 标记文件。";
  $("#ver").textContent = "版本 " + (CFG.VERSION || "?") + " · 模块目录 " + M;
}

async function refresh(quiet) {
  if (busy) return;
  if (!quiet) setBusy(true, "正在读取状态…");
  try {
    CFG = await readCfg();
    render();
    if (!quiet) logLine("状态已刷新", "ok");
  } catch (e) {
    logLine("读取失败: " + e.message, "bad");
    $("#ver").textContent = "读取失败：" + e.message;
  } finally {
    if (!quiet) setBusy(false);
  }
}

$("#refresh").addEventListener("click", () => refresh(false));
$("#status").addEventListener("click", async () => {
  if (busy) return;
  setBusy(true, "正在读取…");
  try {
    const r = await run("sh " + q(M + "/service.sh") + " --status");
    for (const line of String(r.out || "").split("\n")) if (line.trim()) logLine(line);
  } catch (e) {
    logLine("失败: " + e.message, "bad");
  } finally {
    setBusy(false);
  }
});

refresh(true);
</script>
</body>
</html>
